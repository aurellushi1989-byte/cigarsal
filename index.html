<!doctype html>
<html lang="sq"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#17130f"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Cigars.al POS"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Cigars.al | Premium POS</title>
<style>

:root{
  --bg:#f5f3ef;--card:#ffffff;--tx:#20231f;--mu:#77786f;--bd:#e7e2d9;
  --gr:#8b6a3e;--dk:#211f1b;--rd:#b83c35;--soft:#eee7dc;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light
}
*{box-sizing:border-box}
html{scroll-padding-top:90px}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:#211f1b;color:#fff;border-bottom:1px solid #3c3932;box-shadow:0 4px 18px #1d19120c}
.brand{display:flex;align-items:center;justify-content:center;padding:10px 18px 6px;max-width:1200px;margin:auto}
.brand img{width:148px;height:42px;object-fit:contain;object-position:center}
.brand .brand-name{font-size:11px;letter-spacing:2.2px;text-transform:uppercase;color:#cbb89b}
.brand .brand-sub{font-size:12px;color:#c5c0b7;margin-top:1px}
h1{font-size:17px;margin:0;padding:0;color:#fff;letter-spacing:.2px}
nav{display:flex;gap:4px;overflow-x:auto;padding:5px 10px 8px;max-width:1200px;margin:auto;scrollbar-width:thin;justify-content:center}
nav button{white-space:nowrap;border:1px solid transparent;background:transparent;color:#c7c2b9;padding:6px 9px;border-radius:8px;font-size:12px;font-weight:650;cursor:pointer;transition:.18s}
nav button:hover{background:#353128;color:#fff}
nav button.on{background:#b08a59;color:#fff;box-shadow:0 3px 10px #0002}
main{padding:20px 16px 36px;max-width:1200px;margin:auto}
.login{min-height:calc(100vh - 100px);display:flex;align-items:center;justify-content:center;padding:22px;background:var(--bg)}.login-card{width:min(380px,100%);background:var(--card);border:1px solid var(--bd);border-radius:22px;padding:28px;display:flex;flex-direction:column;gap:13px;box-shadow:0 12px 36px #3427160d;text-align:center}.login-card img{width:190px;height:70px;object-fit:contain;margin:0 auto 4px;background:#211f1b;border-radius:12px;padding:12px}.login-card p{font-size:16px;font-weight:750;margin:4px 0 10px}.login-card button{width:100%;min-height:48px}.login-card small{font-size:11px;color:var(--mu);line-height:1.5;margin-top:6px}
main:before{content:"";display:block}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:12px;margin:12px 0 18px}
.c{background:var(--card);border:1px solid var(--bd);border-radius:15px;padding:16px;box-shadow:0 4px 16px #34271606;min-width:0}
.c small{color:var(--mu);display:block;font-size:12px;line-height:1.4;margin-bottom:7px}
.c b{font-size:22px;color:var(--gr);font-weight:750;letter-spacing:-.4px;overflow-wrap:anywhere}
.c b.n{color:var(--tx)}
.box{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:17px;margin:12px 0;box-shadow:0 4px 18px #34271605}
.box>b{display:block;font-size:15px;margin-bottom:10px}
.sc{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:11px 10px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap}
th{color:var(--mu);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.5px;background:#faf9f6}
tr:last-child td{border-bottom:0}
button,input,select{font:inherit;color:var(--tx)}
input,select{background:#fff;border:1px solid #ded8ce;border-radius:10px;padding:10px 12px;width:100%;min-height:42px;outline:none}
input:focus,select:focus{border-color:#a98453;box-shadow:0 0 0 3px #b08a591c}
label{display:block;font-size:12px;color:var(--mu);font-weight:650;margin:10px 0}
button{cursor:pointer;transition:transform .12s,filter .12s}
button:active{transform:scale(.98)}
button.b,button.pri,button.dg{border-radius:10px;padding:10px 14px;font-weight:700;min-height:40px}
button.b{background:#f7f5f1;border:1px solid #e3ddd3;color:#4b463e}
button.b:hover{background:#eee8de}
button.pri{background:#8b6a3e;color:#fff;border:1px solid #8b6a3e;box-shadow:0 3px 8px #8b6a3e20}
button.pri:hover{background:#74552f}
button.dg{background:#fff1ef;color:#b83c35;border:1px solid #f0d5d1}
button:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}
.row{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin:10px 0}
.row>*{flex:1 1 140px;min-width:0}
.row>button{flex:0 0 auto}
.pos{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(300px,1fr);gap:14px;align-items:start}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.p{background:var(--card);border:1px solid var(--bd);border-radius:13px;padding:10px;text-align:left;display:block;width:100%;min-width:0;box-shadow:0 3px 12px #34271605}
.p:hover:not(:disabled){border-color:#b08a59;box-shadow:0 5px 16px #34271610;transform:translateY(-1px)}
.p:disabled{opacity:.5}
.p img{width:100%;height:82px;object-fit:cover;border-radius:8px;background:#f0ece5}
.ph{height:82px;border-radius:8px;background:#f1ece3;display:flex;align-items:center;justify-content:center;color:#987b54;font-size:25px;margin-bottom:7px}
.p b{display:block;font-size:12px;line-height:1.35;margin:5px 0;overflow-wrap:anywhere}
.p span{display:block;font-size:11px;color:var(--mu)}
.warn{color:var(--rd)}
dialog{border:1px solid var(--bd);border-radius:18px;background:var(--card);color:var(--tx);width:min(560px,94vw);max-height:90vh;overflow:auto;padding:22px;box-shadow:0 24px 80px #17130e33}
dialog::backdrop{background:#17130e70;backdrop-filter:blur(3px)}
dialog h3{margin:0 0 14px;font-size:19px}
#toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#25221d;color:#fff;padding:11px 17px;border-radius:12px;display:none;z-index:20;box-shadow:0 8px 30px #0002;max-width:90vw}
#print{display:none}
.mu{color:var(--mu)}
@media(max-width:799px){
  .brand{padding:8px 14px 4px}.brand img{width:130px;height:35px}
  nav{padding:7px 10px 10px;gap:4px}
  nav button{padding:9px 11px;font-size:12px}
  main{padding:14px 11px 28px}
  .pos{grid-template-columns:1fr}
  .pos>.box{margin-top:0}
  .cards{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
  .c{padding:13px}.c b{font-size:19px}
  .box{padding:13px;border-radius:13px}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  th,td{padding:9px 8px}
}
@media(min-width:800px){.brand{padding-left:22px;padding-right:22px}main{padding-top:24px}}
@media print{body>*:not(#print){display:none!important}#print{display:block;font:13px monospace;color:#000;background:#fff}}


/* POS premium seller interface */
.pos-shell{max-width:1500px;margin:-8px auto 0}
.pos-top{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:center;background:linear-gradient(135deg,#211f1b,#33291d);padding:16px 18px;border-radius:16px;color:#fff;margin-bottom:14px}
.pos-search{position:relative}.pos-search input{border-radius:999px;padding:13px 18px 13px 44px;background:#fbf8f3;border:1px solid #e7d9c5;font-size:15px}.pos-search:before{content:'⌕';position:absolute;left:17px;top:4px;font-size:28px;color:#6e5b43;z-index:1}
.pos-meta{font-size:12px;color:#e4d7c5;text-align:right;white-space:nowrap}.pos-cats{display:flex;gap:8px;overflow-x:auto;padding:0 0 13px;scrollbar-width:thin}.pos-cats button{border:1px solid #6b5436;background:#29251f;color:#f8f2e8;border-radius:999px;padding:10px 17px;white-space:nowrap;font-weight:700}.pos-cats button.on{background:linear-gradient(135deg,#e4b75f,#a8792f);border-color:#d6a34d;color:#211b12}
.pos-layout{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(310px,.9fr);gap:14px;align-items:stretch}.pos-products{background:#f9f5ef;border:1px solid #e7ded2;border-radius:18px;padding:12px}.pos-products-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}.pos-products-head b{font-size:16px}.pos-products-head small{color:var(--mu)}
.pos-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}.pos-grid .p{padding:10px;border-radius:15px;background:#fffdfa;border-color:#eee5da;box-shadow:0 3px 10px #30210c0b;position:relative}.pos-grid .p img,.pos-grid .p .ph{height:118px;object-fit:contain;background:#f5efe6;border-radius:10px;margin-bottom:8px}.pos-grid .p b{font-size:13px;min-height:34px}.pos-grid .p span{font-size:13px;color:#9a6b20;font-weight:800}.pos-grid .p:after{content:'+';position:absolute;right:10px;bottom:10px;border-radius:50%;width:28px;height:28px;background:#b88a42;color:white;font-size:22px;line-height:27px;text-align:center;box-shadow:0 2px 6px #0002}
.pos-cart{background:#fffdfa;border:1px solid #e5d7c4;border-radius:18px;padding:0;overflow:hidden;display:flex;flex-direction:column;min-height:450px;box-shadow:0 4px 15px #36230d0b}.pos-cart-head{background:linear-gradient(120deg,#f1e1cb,#fff8ef);padding:15px 17px;border-bottom:1px solid #e7d9c7;font-size:20px;font-weight:800;display:flex;justify-content:space-between;align-items:center}.pos-cart-body{padding:10px 15px;flex:1}.pos-cart-line{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid #eee5da}.pos-cart-thumb{width:48px;height:48px;border-radius:9px;object-fit:contain;background:#f3ece2}.pos-cart-name{font-weight:750;line-height:1.3}.pos-cart-sub{font-size:12px;color:var(--mu);margin-top:4px}.pos-cart-price{font-weight:800;white-space:nowrap}.pos-qty{display:flex;gap:5px;align-items:center;margin-top:7px}.pos-qty button{width:27px;height:27px;min-height:27px;padding:0;border-radius:50%;font-weight:800}.pos-qty strong{min-width:20px;text-align:center}.pos-cart-bottom{border-top:1px solid #e7ded2;padding:15px;background:#fffaf3}.pos-total{display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:16px;margin:4px 0 14px}.pos-total strong{font-size:27px;color:#a9782b}.pos-checkout{width:100%;min-height:54px!important;border-radius:13px!important;background:linear-gradient(135deg,#d6a650,#98651d)!important;border-color:#bb8b3e!important;font-size:16px!important;box-shadow:0 5px 12px #a9782b30!important}.pos-payrow{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}.pos-payrow button{min-height:42px;border-radius:11px}.pos-summary{display:flex;gap:12px;flex-wrap:wrap;padding:13px 16px;margin-top:14px;border:1px solid #e5d7c4;background:#fffaf4;border-radius:15px}.pos-summary span{flex:1 1 130px;border-right:1px solid #e5d7c4;padding-right:10px}.pos-summary small{display:block;color:var(--mu)}.pos-summary b{font-size:17px}
@media(max-width:850px){.pos-layout{grid-template-columns:1fr}.pos-cart{min-height:0}.pos-top{grid-template-columns:1fr}.pos-meta{text-align:left}.pos-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.pos-grid .p img,.pos-grid .p .ph{height:105px}.pos-summary span{border-right:0}.pos-shell{margin:0}}


/* Cigars.al reference-inspired desktop sidebar and premium POS finish */
:root{--bg:#f5eee5;--card:#fffaf4;--tx:#201b15;--mu:#7c7165;--bd:#e7d8c5;--gr:#b18436;--dk:#211b15;--soft:#f0e4d3}
body{background:radial-gradient(ellipse at 70% 0%,#fffaf4 0,#f5eee5 60%,#eee2d2 100%)}
header{background:linear-gradient(180deg,#211b15,#17130f);box-shadow:4px 0 22px #1c130d20}
.brand{padding:18px 12px 13px}.brand img{width:160px;height:56px}
nav button{font-size:13px;padding:10px 12px;border-radius:10px}

button.pri{background:linear-gradient(135deg,#d6a650,#98651d);border-color:#b88a42}
.c,.box{box-shadow:0 5px 18px #4a2e120b}
.pos-top{background:linear-gradient(120deg,#211b15,#33271b);border:1px solid #5b452b;border-radius:18px}
.pos-products{background:#fbf6ef;border-color:#e8dac7}

@media(min-width:1000px){
 body{padding-left:190px}
 header{position:fixed;left:0;top:0;bottom:0;width:190px;overflow-y:auto;border-right:1px solid #4a3a28;border-bottom:0;display:flex;flex-direction:column;justify-content:flex-start}

@media(max-width:999px){header{position:sticky}.brand{padding:8px 14px 4px}.brand img{width:130px;height:40px}}


/* Reference-matched admin dashboard + seller checkout */
.admin-heading{display:flex;justify-content:space-between;align-items:center;gap:18px;margin:0 0 18px;padding:4px 2px}

@media(max-width:650px){.admin-heading{align-items:flex-start;flex-direction:column}.admin-heading h2{font-size:23px}.admin-date{padding:8px 10px}.admin-quick{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.admin-quick button{min-height:75px}.metric-card{gap:8px;padding:11px}.metric-icon{width:37px;height:37px;flex-basis:37px;font-size:19px}.metric-content b{font-size:17px}}

/* ===== Menu & layout as in reference photos ===== */
.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
body.out header,body.out #top,body.out #bnav,body.out #sheet{display:none!important}
.lg{font:600 34px/1 Georgia,'Times New Roman',serif;color:#241c14;letter-spacing:-.5px}.lg span{color:#b18436}
header .lg{color:#f6ead7;font-size:30px}header .brand{flex-direction:column;gap:6px}header .brand small{font-size:9px;letter-spacing:3px;color:#c9a35e}
header nav button{display:flex;align-items:center;gap:13px;text-align:left}header nav button.on{box-shadow:0 4px 14px #0004}
#top{display:flex;align-items:center;gap:16px;padding:12px 24px;position:relative;z-index:6}
#top.dk{background:linear-gradient(120deg,#211b15,#33271b);position:sticky;top:0;color:#fff}
.tl{flex:1;text-align:center;display:flex;flex-direction:column;align-items:center}.tl small{font-size:9px;letter-spacing:3px;color:#b18436}.tl .lg{font-size:40px}

.ud{display:none;position:absolute;right:0;top:100%;background:#fff;border:1px solid var(--bd);border-radius:12px;padding:6px;min-width:130px;box-shadow:0 8px 24px #0002}.ud.open{display:block}.ud button{display:flex;gap:8px;align-items:center;width:100%;border:0;background:none;padding:9px;color:#b83c35;font-weight:700}

.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:14px}.kc{display:flex;gap:12px;align-items:center;background:#fffaf4;border:1px solid #e7d8c5;border-radius:16px;padding:14px;box-shadow:0 5px 16px #4a2e120b}
.ki{width:46px;height:46px;border-radius:50%;background:#f6e2b7;color:#8a5a14;display:grid;place-items:center;flex:0 0 46px}.kc small{display:block;color:var(--mu)}.kc b{font-size:24px;display:block;line-height:1.2}.kc em{font-style:normal;font-size:12px;color:var(--mu)}.kc em.up{color:#2e8b4a;font-weight:700}.kc em.dn{color:#b83c35;font-weight:700}

.qa{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}.qa button{min-height:84px;border:1px solid #e5d8c7;border-radius:16px;background:#fffaf4;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:#211b14}.qa .i{width:30px;height:30px;color:#a8792f}.qa .qp{background:linear-gradient(135deg,#2b241b,#17130f);color:#fff}.qa .qp .i{color:#e3b75f}
.es{display:flex;gap:10px;margin-bottom:10px}.es .pos-search{flex:1}.es .b{display:flex;gap:6px;align-items:center}.pos-search:before{content:none}.pos-search input{padding-left:18px}

 if(!confirm("Të rikthehen të dhënat nga "+label+"?\n"+d.prods.length+" produkte, "+d.sales.length+" shitje, "+d.purchases.length+" furnizime, "+d.expenses.length+" shpenzime.\n"+(e||w?"Kontrolli gjeti "+e+" gabime dhe "+w+" paralajmërime në këtë kopje.\n":"Kontrolli i integritetit: në rregull.\n")+"Shitësit ("+(d.users||[]).length+") dhe PIN-i zëvendësohen me ata të kopjes.\nTë dhënat aktuale zëvendësohen; para kësaj krijohet dhe verifikohet një kopje e tyre."))return;
 if(!await safeBackup("para-rikthimit"))return;db=norm(pickDb(d));save();flush();toast("Të dhënat u rikthyen"+(e?" (kujdes: "+e+" gabime në të dhëna)":""));render()}
async function restoreSnap(k){try{const r=await idbDo("snap","readonly",st=>st.get(k));restoreFrom(r.json,"kopjen e "+D(r.t))}catch(e){toast("Kopja nuk u lexua")}}
async function loadSnaps(){const el=$("snaps");if(!el)return;try{const recs=(await idbDo("snap","readonly",st=>st.getAll())).sort((a,b)=>b.t-a.t);el.innerHTML=recs.length?recs.slice(0,10).map(r=>`<div class="row" style="justify-content:space-between"><span>${D(r.t)} · ${r.sales} shitje · ${r.prods} produkte · ${r.tag==="d"?"ditore":esc(r.tag)}</span><button class="b" onclick="restoreSnap('${r.k}')">Rikthe</button></div>`).join(""):"Ende pa kopje."}catch(e){el.textContent="Kopjet nuk lexohen: "+e.message}}
/* dosje lokale (Google Drive Desktop / OneDrive / Dropbox) */
async function dirInit(){try{if(!window.showDirectoryPicker)return;const h=await idbDo("kv","readonly",st=>st.get("dir"));if(!h)return;dirH=h;ST.dir=(await h.queryPermission({mode:"readwrite"}))==="granted"?"ok":"perm"}catch(e){ST.dir="off"}updSave()}
async function dirPick(){if(!adminOnly())return;if(!window.showDirectoryPicker)return toast("Ky shfletues nuk e mbështet. Përdor Chrome ose Edge në kompjuter.");try{dirH=await showDirectoryPicker({mode:"readwrite",id:"cigars-backup"});await idbDo("kv","readwrite",st=>st.put(dirH,"dir"));ST.dir="ok";await folderWrite(JSON.stringify(db),true);toast("Ruajtja në dosje u aktivizua");render()}catch(e){if(e.name!=="AbortError")toast("Dosja nuk u zgjodh: "+e.message)}}
async function dirAllow(){if(!adminOnly())return;try{ST.dir=(await dirH.requestPermission({mode:"readwrite"}))==="granted"?"ok":"perm";if(ST.dir==="ok")await folderWrite(JSON.stringify(db),true);render()}catch(e){toast(e.message)}}
async function wf(h,name,txt){const fh=await h.getFileHandle(name,{create:true}),w=await fh.createWritable();await w.write(txt);await w.close()}
async function folderWrite(json,force){if(!dirH||ST.dir!=="ok")return;try{await wf(dirH,"cigars-pos-backup.json",json);const fh=await dirH.getFileHandle("cigars-pos-backup.json");if((await(await fh.getFile()).text())!==json)throw Error("verifikimi i skedarit në dosje dështoi");
 const d=new Date().toISOString().slice(0,10);if(force||folderWrite.d!==d){await wf(dirH,"cigars-pos-"+d+".json",json);folderWrite.d=d}ST.dirT=Date.now();ST.dirErr="";markExt()}
 catch(e){ST.dirErr=(e&&e.message)||"gabim";if(e&&(e.name==="NotAllowedError"||e.name==="SecurityError"))ST.dir="perm"}updSave()}
async function dirRestore(){if(!adminOnly())return;try{const fh=await dirH.getFileHandle("cigars-pos-backup.json");restoreFrom(await(await fh.getFile()).text(),"dosjen lokale")}catch(e){toast("Nuk u gjet kopje në dosje")}}
/* Google Drive direkt */
function gLoad(){return new Promise((res,rej)=>{if(window.google&&google.accounts&&google.accounts.oauth2)return res();const x=document.createElement("script");x.src="https://accounts.google.com/gsi/client";x.onload=res;x.onerror=()=>rej(Error("Google nuk u ngarkua (internet?)"));document.head.appendChild(x)})}
async function gConnect(){if(!adminOnly())return;if(!cfg.gid)return toast("Vendos fillimisht Google Client ID");if(location.protocol==="file:")return toast("Drive direkt nuk punon nga skedar lokal (file://). Hape aplikacionin nga https ose përdor dosjen e sinkronizuar.");
 try{await gLoad()}catch(e){return toast(e.message)}gTC=google.accounts.oauth2.initTokenClient({client_id:cfg.gid,scope:"https://www.googleapis.com/auth/drive.file",callback:r=>{if(r.error)return toast("Google: "+r.error);gTok=r.access_token;gExp=Date.now()+(r.expires_in-60)*1000;ST.drive="ok";toast("Google Drive u lidh");driveUp(true).catch(e=>toast(e.message));render()}});gTC.requestAccessToken({prompt:cfg.gok?"":"consent"});cfg.gok=1;saveCfg()}
async function gFetch(url,o){const r=await fetch(url,{...o,headers:{...(o&&o.headers),Authorization:"Bearer "+gTok}});if(!r.ok)throw Error("Google Drive "+r.status);return r}
async function driveUp(force){if(!gTok||Date.now()>gExp){ST.drive=gTok?"exp":"off";if(force)throw Error("Lidhu fillimisht me Google Drive");return}
 const name="cigars-pos-backup.json";let id=cfg.gfid;
 if(!id){const l=await(await gFetch("https://www.googleapis.com/drive/v3/files?q="+encodeURIComponent("name='"+name+"' and trashed=false")+"&fields=files(id)")).json();id=l.files&&l.files[0]&&l.files[0].id}
 const b="cigarsb"+Date.now(),body="--"+b+"\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n"+JSON.stringify({name,mimeType:"application/json"})+"\r\n--"+b+"\r\nContent-Type: application/json\r\n\r\n"+JSON.stringify(db)+"\r\n--"+b+"--";
 const r=await(await gFetch("https://www.googleapis.com/upload/drive/v3/files"+(id?"/"+id:"")+"?uploadType=multipart&fields=id",{method:id?"PATCH":"POST",headers:{"Content-Type":"multipart/related; boundary="+b},body})).json();cfg.gfid=r.id;saveCfg();ST.drive="ok";ST.driveT=Date.now();ST.driveErr="";drivePend=false;markExt();updSave()}
async function driveRestore(){if(!adminOnly())return;try{if(!gTok||Date.now()>gExp)return toast("Lidhu fillimisht me Google Drive");const id=cfg.gfid;if(!id)return toast("Nuk ka kopje në Drive");restoreFrom(await(await gFetch("https://www.googleapis.com/drive/v3/files/"+id+"?alt=media")).text(),"Google Drive")}catch(e){toast(e.message)}}
setInterval(()=>{if(drivePend&&gTok){if(Date.now()>gExp){ST.drive="exp";drivePend=false;updSave();return}driveUp().catch(e=>{ST.driveErr=e.message;updSave()})}},60000);
/* kopje manuale */
async function shareCopy(){if(!adminOnly())return;const name="cigars-pos-"+new Date().toISOString().slice(0,10)+".json",txt=wrapExport(JSON.stringify(db)),file=new File([txt],name,{type:"application/json"});
 if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file],title:"Kopje Cigars.al POS"});markExt();return}catch(e){if(e.name==="AbortError")return}}
 dl(name,txt,"application/json");markExt();toast("Kopja u shkarkua (me shumë kontrolli). Ngarkoje në Google Drive ose dërgoje me email.")}
function markExt(){cfg.lastExt=Date.now();saveCfg()}
async function askPersist(quiet){try{if(navigator.storage&&navigator.storage.persist){ST.persist=await navigator.storage.persist();if(!quiet)toast(ST.persist?"Ruajtja e përhershme u aktivizua":"Shfletuesi nuk e dha lejen (shto faqen te faqeshënuesit ose instalo aplikacionin)")}}catch(e){}if(!quiet&&view==="set")render()}
/* shporta e papërfunduar */
function saveDraft(){try{if(!meId)return;if(cart.length)localStorage.setItem(CK+meId,JSON.stringify({cart,disc,pay,onote}));else localStorage.removeItem(CK+meId)}catch(e){}}
function restoreDraft(){try{const d=JSON.parse(localStorage.getItem(CK+meId));if(d&&d.cart&&d.cart.length){cart=d.cart.filter(i=>db.prods.some(p=>p.id===i.pid&&p.active));disc=0;pay=d.pay||"cash";onote=d.onote||"";if(cart.length)toast("Shporta e papërfunduar u rikthye")}}catch(e){}}
/* UI */
const svb=()=>'<button id="sv" class="svc" onclick="svClick()"></button>';
function svClick(){if(ST.dir==="perm")dirAllow();else if(role==="admin")go("set")}
function updSave(){const e=$("sv"),b=$("sb"),adm=role==="admin";let c="",tx,msg="";const lsE=ST.ls==="err",idE=ST.idb==="err";
 if(lsE&&idE){c="e";tx="⚠ NUK U RUAJT";msg="Të dhënat NUK u ruajtën: "+ST.err+" · "+ST.idbErr}
 else if(lsE){c="e";tx="⚠ Ruajtje e pjesshme";msg="Ruajtja kryesore dështoi ("+ST.err+"); të dhënat ekzistojnë vetëm në kopjen e brendshme."}
 else if(idE){c="w";tx="⚠ Pa kopje të brendshme"}
 else if(ST.dir==="perm"){c="w";tx="⚠ Rilidh dosjen"}
 else if(ST.dirErr){c="w";tx="⚠ Gabim te dosja"}
 else if(ST.driveErr){c="w";tx="⚠ Gabim te Drive"}
 else if(ST.pending){c="w";tx="Duke ruajtur…"}
 else tx="✓ Ruajtur"+(ST.lsT?" "+D(ST.lsT).slice(11):"")+(ST.dir==="ok"?" · dosje":"")+(ST.drive==="ok"?" · Drive":"");
 if(e){e.className="svc "+c;e.textContent=tx}
 if(b){b.style.display=msg?"flex":"none";if(msg)b.innerHTML="<span>"+esc(msg)+(adm?"":" Njofto administratorin.")+"</span><button onclick=\"save();flushNow()\">Provo përsëri</button>"+(adm?"<button onclick=\"shareCopy()\">Shkarko kopje</button>":"")}}
window.addEventListener("error",e=>{try{toast("Gabim i papritur: "+e.message)}catch(x){}});
window.addEventListener("unhandledrejection",e=>{try{toast("Gabim i papritur: "+((e.reason&&e.reason.message)||e.reason))}catch(x){}});
function safePanel(){const t=x=>x?D(x):"—",b=(c,tx)=>`<span class="dot ${c}"></span>${tx}`;
 const dirTxt=!window.showDirectoryPicker?b("n","Nuk mbështetet në këtë shfletues (përdor Chrome/Edge në kompjuter)"):ST.dir==="ok"?b("g","Aktive · shkrimi i fundit "+t(ST.dirT)):ST.dir==="perm"?b("o","Pauzuar — duhet leje"):b("n","Jo e aktivizuar");
 const drTxt=ST.drive==="ok"?b("g","E lidhur · ngarkimi i fundit "+t(ST.driveT)):ST.drive==="exp"?b("o","Sesioni skadoi — lidhu përsëri"):b("n","Jo e lidhur");
 return`<div class="box"><b>Siguria e të dhënave</b><p class="mu" style="font-size:13px">Çdo ndryshim ruhet menjëherë në pajisje. Edhe nëse faqja mbyllet aksidentalisht ose kompjuteri fiket, të dhënat mbeten.</p>
 <div class="ss">${ST.err||ST.idbErr?`<div class="warn">⚠ Gabimi i fundit: ${esc(ST.err||ST.idbErr)}</div>`:""}<div>${b(ST.bkT?"g":"n","Backup i fundit i verifikuar: "+(ST.bkT?t(ST.bkT)+" ("+esc(ST.bkTag||"")+")":"asnjë në këtë sesion"))}</div><div>${b(Date.now()-(cfg.lastExt||0)<7*864e5?"g":"o","Kopja e fundit jashtë shfletuesit (dosje/Drive/skedar): "+(cfg.lastExt?t(cfg.lastExt):"asnjë"))}</div>${ST.dirErr?`<div class="warn">⚠ Dosja: ${esc(ST.dirErr)}</div>`:""}${ST.driveErr?`<div class="warn">⚠ Drive: ${esc(ST.driveErr)}</div>`:""}<div>Madhësia e të dhënave: <b>${((ST.size||JSON.stringify(db).length)/1024).toFixed(0)} KB</b> nga ~5000 KB që lejon shfletuesi${(ST.size||JSON.stringify(db).length)>3.5e6?' <span class="warn">⚠ afër kufirit: përdor "Ngjesh fotot"</span>':''}</div><div>${b(ST.ls==="err"?"r":"g","Ruajtja në pajisje: "+(ST.ls==="err"?"GABIM":"aktive")+" · e fundit "+t(db.savedAt))}</div><div>${b(ST.idb==="err"?"r":"g","Kopja e brendshme + kopje automatike: "+(ST.idb==="err"?"GABIM":"aktive"))}</div><div>${b(ST.persist?"g":"o","Mbrojtje nga pastrimi i shfletuesit: "+(ST.persist?"po":"jo ende"))} ${ST.persist?"":'<button class="b" onclick="askPersist()">Kërko</button>'}</div></div>
 <hr><b>1. Dosje e sinkronizuar me Google Drive (rekomanduar)</b><p style="font-size:13px" class="mu">Zgjidh një dosje brenda "Google Drive" të kompjuterit (Google Drive for desktop). Aplikacioni shkruan kopjen aty pas çdo ndryshimi dhe Drive e ngarkon vetë online. Punon edhe me OneDrive/Dropbox.</p>
 <div>${dirTxt}</div><div class="row"><button class="pri" onclick="dirPick()">Zgjidh dosjen</button>${ST.dir==="perm"?'<button class="b" onclick="dirAllow()">Rilidh lejen</button>':''}${ST.dir==="ok"||ST.dir==="perm"?'<button class="b" onclick="dirRestore()">Rikthe nga dosja</button>':''}</div>
 <hr><b>2. Google Drive direkt (OAuth) — eksperimentale</b><p style="font-size:13px" class="mu">Nuk është testuar me llogari reale Google në këtë version. Kërkon Client ID nga Google Cloud dhe që aplikacioni të hapet nga https (jo nga skedar lokal).</p>
 <div>${drTxt}</div><div class="row"><input id="gid" placeholder="Google OAuth Client ID" value="${esc(cfg.gid||"")}" onchange="cfg.gid=this.value.trim();saveCfg()"><button class="b" onclick="gConnect()">Lidhu</button><button class="b" onclick="driveUp(true).then(()=>render()).catch(e=>toast(e.message))">Ngarko tani</button><button class="b" onclick="driveRestore()">Rikthe nga Drive</button></div>
 <hr><b>3. Kopje manuale</b><div class="row"><button class="pri" onclick="manualBackup()">Krijo dhe verifiko backup tani</button><button class="pri" onclick="shareCopy()">Dërgo / shkarko kopjen (Drive, email…)</button><button class="b" onclick="$('fj').click()">Rikthe nga skedar</button><button class="b" onclick="$('fv').click()">Verifiko skedar (pa rikthim)</button><button class="b" onclick="shrinkAll()">Ngjesh fotot</button><input id="fv" type="file" accept=".json" hidden onchange="verifyBackup(this.files[0]);this.value=''"><input id="fj" type="file" accept=".json" hidden onchange="impJson(this.files[0]);this.value=''"></div>
 <hr><b>Kopjet automatike në pajisje</b><div id="snaps" class="mu">Duke u ngarkuar…</div><p class="mu" style="font-size:12px">Kopjet përmbajnë edhe fjalëkalimet e koduara (hash) të shitësve; ruaji në vend të sigurt.</p></div>`}
/* siguria kundër mbylljes aksidentale */
window.addEventListener("beforeunload",e=>{if(dirty||cart.length){flushNow();e.preventDefault();e.returnValue=""}});
window.addEventListener("pagehide",()=>{flushNow()});
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden")flushNow()});
window.addEventListener("storage",e=>{if(e.key===K&&e.newValue){try{const d=JSON.parse(e.newValue);if(validDb(d)&&(d.savedAt||0)>(db.savedAt||0)){db=norm(d);if(role)render()}}catch(x){}}});
const IDLE={admin:6e5,seller:18e5};let lastAct=Date.now();["pointerdown","keydown","touchstart"].forEach(ev=>addEventListener(ev,()=>{lastAct=Date.now()},{passive:true}));
setInterval(()=>{if(role&&Date.now()-lastAct>IDLE[role]){const had=role==="seller"&&cart.length;logout(true);toast("U dalët automatikisht për shkak të mosaktivitetit"+(had?". Shporta ruhet dhe rikthehet pas hyrjes.":""))}},5000);
(function init(){if(!db.savedAt&&(db.sales.length||db.purchases.length||db.expenses.length||db.prods.some(p=>p.price||p.qty)))save();else if(db.savedAt){dirty=true;flush()}
 recover();dirInit();try{navigator.storage&&navigator.storage.persisted&&navigator.storage.persisted().then(v=>ST.persist=v)}catch(e){}})();
if("serviceWorker"in navigator&&/^https?:$/.test(location.protocol))navigator.serviceWorker.register("sw.js").catch(()=>{});
</script></body></html>
